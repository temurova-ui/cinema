version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: cinema_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    restart: always
    ports:
      - "6379:6379"

  user-service:
    build:
      context: .
      dockerfile: ./userservice/Dockerfile
    container_name: cinema_user_service
    ports:
      - "50051:50051"
    depends_on:
      - postgres
      - redis

  movie-service:
    build:
      context: .
      dockerfile: ./movieservice/Dockerfile
    container_name: cinema_movie_service
    ports:
      - "50052:50052"
    depends_on:
      - postgres

  booking-service:
    build:
      context: .
      dockerfile: ./bookingser/Dockerfile
    container_name: cinema_booking_service
    ports:
      - "50053:50053"
    depends_on:
      - postgres
      - user-service
      - movie-service

  api-gateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: cinema_api_gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - movie-service
      - booking-service

volumes:
  postgres_data:
